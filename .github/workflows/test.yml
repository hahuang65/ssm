---
name: test
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install formatters
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/daixiang0/gci@v0.13.5
      - name: Verify formatting
        # Order matters: gofumpt first, then goimports adds missing imports,
        # then gci groups them. Any drift fails the job via git diff.
        run: |
          gofumpt -w .
          goimports -w -local github.com/hahuang65/ssm .
          gci write --skip-generated \
            -s standard \
            -s default \
            -s 'prefix(github.com/hahuang65/ssm)' \
            .
          if ! git diff --exit-code; then
            echo "::error::Formatting drift. Run gofumpt, goimports, then gci locally."
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
